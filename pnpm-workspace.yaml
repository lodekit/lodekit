packages:
  - 'packages/*'
  - 'web/*'
  - 'manager'

# Supply-chain cooldown: a published version must be at least this old (minutes)
# before it's installable — quarantines fresh, potentially-compromised releases.
# Pin an exact version explicitly to bypass when a genuine security patch lands.
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - '@lodekit/*'
  - '@playwright/test@1.62.1'
  - 'playwright@1.62.1'
  - 'playwright-core@1.62.1'

# drizzle-kit's api.mjs imports drizzle-orm without declaring it — masked by
# hidden hoisting in a per-repo virtual store, but a hard ERR_MODULE_NOT_FOUND
# under strict resolution (e.g. enable-global-virtual-store). Declare the peer.
# @astrojs/mdx has the same defect: dist/satteri/index.js imports satteri,
# which it declares only in its own devDependencies. Declare it for real.
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
  '@astrojs/mdx':
    dependencies:
      satteri: '^0.9.1'
