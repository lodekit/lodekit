name: deploy-web-main

# Dispatch-only for now — no autodeploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy (defaults to the branch you dispatch from)"
        required: false

# Never cancel a half-finished sync; queued dispatches run in order.
concurrency:
  group: deploy-web-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: pnpm
      # `...` pulls workspace deps — the site bundles @lodekit/engine/marks.
      - run: pnpm install --filter @lodekit/web-main...
      - run: pnpm --filter @lodekit/web-main build
      # Config reaches the shell via env, never inline ${{ }} in run: blocks.
      - name: Sync to buckets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUCKET: ${{ vars.WEB_MAIN_BUCKET }}
          WWW_BUCKET: ${{ vars.WEB_MAIN_WWW_BUCKET }}
        run: |
          for b in "$BUCKET" "$WWW_BUCKET"; do
            # Hashed assets first, additive only: old hashes stay alive, so HTML
            # at origin, in the pre-purge CDN cache, or in an open tab never 404s.
            aws s3 sync web/main/dist/_astro "s3://$b/_astro" \
              --endpoint-url https://s3.fr-par.scw.cloud \
              --region fr-par \
              --cache-control "public, max-age=31536000, immutable"
            # Then pages + public/ files. --delete never reaches _astro/: removed
            # routes disappear, old hashed assets survive (accepted growth, no GC).
            aws s3 sync web/main/dist "s3://$b" \
              --endpoint-url https://s3.fr-par.scw.cloud \
              --region fr-par \
              --exclude "_astro/*" \
              --delete \
              --cache-control "public, max-age=60, must-revalidate"
          done
      - name: Purge Edge Services caches
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          PIPELINE_ID: ${{ vars.WEB_MAIN_PIPELINE_ID }}
          WWW_PIPELINE_ID: ${{ vars.WEB_MAIN_WWW_PIPELINE_ID }}
        run: |
          for p in "$PIPELINE_ID" "$WWW_PIPELINE_ID"; do
            curl --fail-with-body -sS -X POST \
              "https://api.scaleway.com/edge-services/v1beta1/purge-requests" \
              -H "X-Auth-Token: $SCW_SECRET_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"pipeline_id\": \"$p\", \"all\": true}"
          done
