name: reuse

# REUSE.toml uses path globs, so a file added outside every glob falls into
# no-license limbo silently. This job is what notices.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
