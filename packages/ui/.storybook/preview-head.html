<!-- Live theme overrides, served by the Lodekit runtime when the static build is
     mounted at /_ui/ (resolves to /_ui/theme.css). 404s harmlessly in storybook dev. -->
<link id="lodekit-theme" rel="stylesheet" href="theme.css">
<!-- Static catalog has no settings store to resolve appearance.theme against —
     system-only, matching the pre-settings default everywhere else. -->
<script>document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches)</script>
