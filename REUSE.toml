version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "packages/sdk/**",
  "packages/ui/**",
  "packages/mcp/**",
  "packages/skill/**",
  "root/**",
  "docs/**",
  "web/docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "Apache-2.0"

# .claude/skills/* are committed symlinks into .agents/skills/ — each carries
# its target's licensing, mirrored per-skill below.
[[annotations]]
path = [".agents/skills/**", ".agents/hooks/**", ".claude/skills/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dillon Frawley"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".agents/skills/writing-skills/**", ".claude/skills/writing-skills"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Jesse Vincent"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/ponytail/**",
  ".agents/skills/ponytail-audit/**",
  ".agents/skills/ponytail-debt/**",
  ".agents/skills/ponytail-review/**",
  ".claude/skills/ponytail",
  ".claude/skills/ponytail-audit",
  ".claude/skills/ponytail-debt",
  ".claude/skills/ponytail-review",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DietrichGebert"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/codebase-design/**",
  ".agents/skills/domain-modeling/**",
  ".claude/skills/codebase-design",
  ".claude/skills/domain-modeling",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matt Pocock"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/session/**",
  ".agents/skills/drain-deferrals/**",
  ".agents/skills/release/**",
  ".claude/skills/session",
  ".claude/skills/drain-deferrals",
  ".claude/skills/release",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "Apache-2.0"

# The Lodekit jar-cloud mark embeds the Material Icons "cloud" glyph
# (Google LLC, Apache-2.0) — packages/ui/src/marks.ts is the vector source; the
# brand mark/badge/lockup assets and favicons carry the glyph verbatim or
# rasterized.
[[annotations]]
path = [
  "web/main/public/favicon.svg",
  "web/main/public/brand/lodekit-mark-*",
  "web/main/public/brand/lodekit-badge-*",
  "web/main/public/brand/lodekit-lockup-*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "AGPL-3.0-only AND Apache-2.0"

[[annotations]]
path = ["packages/ui/src/marks.ts", "web/docs/public/favicon.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["packages/ui/shadcn-tailwind.css", "packages/ui/src/components/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2023 shadcn", "2026 The Lodekit Authors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "web/main/src/components/demo/prompt-kit/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Julien Thibeaut"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/catppuccin.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2021 Catppuccin"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/dracula.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Dracula Theme"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/nord.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016-present Sven Greb"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/rose-pine.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Rosé Pine"
SPDX-License-Identifier = "MIT"
