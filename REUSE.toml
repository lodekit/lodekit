version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "packages/sdk/**",
  "packages/ui/**",
  "packages/mcp/**",
  "packages/skill/**",
  "root/**",
  "docs/**",
  "web/docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".agents/skills/**", ".agents/hooks/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dillon Frawley"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".agents/skills/writing-skills/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Jesse Vincent"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/ponytail/**",
  ".agents/skills/ponytail-audit/**",
  ".agents/skills/ponytail-debt/**",
  ".agents/skills/ponytail-review/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DietrichGebert"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/codebase-design/**",
  ".agents/skills/domain-modeling/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matt Pocock"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".agents/skills/session/**",
  ".agents/skills/drain-deferrals/**",
  ".agents/skills/release/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "Apache-2.0"

# The Lodekit jar-cloud mark embeds the Material Icons "cloud" glyph
# (Google LLC, Apache-2.0) — marks.ts is the vector source; the brand
# mark/badge/lockup assets and favicons carry the glyph verbatim or rasterized.
[[annotations]]
path = [
  "packages/engine/src/marks.ts",
  "web/main/public/favicon.svg",
  "web/main/public/brand/lodekit-mark-*",
  "web/main/public/brand/lodekit-badge-*",
  "web/main/public/brand/lodekit-lockup-*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "AGPL-3.0-only AND Apache-2.0"

[[annotations]]
path = "web/docs/public/favicon.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["packages/ui/shadcn-tailwind.css", "packages/ui/src/components/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2023 shadcn", "2026 The Lodekit Authors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "web/main/src/components/demo/prompt-kit/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Julien Thibeaut"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/catppuccin.css"
