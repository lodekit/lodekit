version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "packages/sdk/**",
  "packages/ui/**",
  "packages/mcp/**",
  "packages/skill/**",
  "root/**",
  "docs/**",
  "web/docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Lodekit Authors"
SPDX-License-Identifier = "Apache-2.0"


# The Lodekit jar-cloud mark embeds the Material Icons "cloud" glyph
# (Google LLC, Apache-2.0) — packages/ui/src/marks.ts is the vector source; the
# brand mark/badge/lockup assets and favicons carry the glyph verbatim or
# rasterized.
[[annotations]]
path = [
  "web/main/public/favicon.svg",
  "web/main/public/brand/lodekit-mark-*",
  "web/main/public/brand/lodekit-badge-*",
  "web/main/public/brand/lodekit-lockup-*",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "AGPL-3.0-only AND Apache-2.0"

[[annotations]]
path = ["packages/ui/src/marks.ts", "web/docs/public/favicon.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 The Lodekit Authors", "Google LLC"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["packages/ui/shadcn-tailwind.css", "packages/ui/src/components/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2023 shadcn", "2026 The Lodekit Authors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "web/main/src/components/demo/prompt-kit/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Julien Thibeaut"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/catppuccin.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2021 Catppuccin"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/dracula.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Dracula Theme"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/nord.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016-present Sven Greb"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packages/engine/themes/rose-pine.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Rosé Pine"
SPDX-License-Identifier = "MIT"

# The landing site's webfont notice — redistributes the font projects'
# copyright lines with the served woff2 files (issue #162).
[[annotations]]
path = "web/main/public/font-licenses.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2021 The M+ FONTS Project Authors (https://github.com/coz-m/MPLUS_FONTS)",
  "2022 The Spline Sans Mono Project Authors (https://github.com/SorkinType/SplineSansMono)",
  "2022 The Zen Project Authors (https://github.com/googlefonts/zen-kakugothic)",
]
SPDX-License-Identifier = "OFL-1.1"
